version: '3.9'

services:
  db:
    image: postgres:15
    container_name: vt-postgres
    restart: always
    environment:
      POSTGRES_USER: vt
      POSTGRES_PASSWORD: example
      POSTGRES_DB: vt
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
